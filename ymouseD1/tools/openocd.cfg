# ============================================================================
# OpenOCD 配置 —— ymouseD1 / STM32F401CCU6
#
# 用法一(调试,推荐用 tools/openocd-debug.ps1 一键完成):
#   终端 A: openocd -f tools/openocd.cfg
#   终端 B: arm-none-eabi-gdb build/Debug/ymouseD1.elf -x tools/debug.gdb
#
# 用法二(只烧录,不调试):
#   openocd -f tools/openocd.cfg -c "program build/Debug/ymouseD1.elf verify reset exit"
#
# 用法三(擦除整片):
#   openocd -f tools/openocd.cfg -c "init; reset halt; flash erase_sector 0 0 last; exit"
# ============================================================================

# ------------------------------- 调试探针 -----------------------------------
# 本机当前插的是 SEGGER J-Link,默认用它。换 ST-Link 时把下面两行对调即可,
# 其余配置都不用改。
source [find interface/jlink.cfg]
# source [find interface/stlink.cfg]

transport select swd

# ------------------------------- 目标芯片 -----------------------------------
# STM32F401CCU6 只有 64KB RAM,把 flash 编程用的 work area 从默认 32KB 降到
# 16KB。必须在 source target 之前设置,因为 stm32f4x.cfg 会读这个变量。
set WORKAREASIZE 0x4000

source [find target/stm32f4x.cfg]
# stm32f4x.cfg 内部已带这些设置,不用重复配:
#   reset_config srst_nogate      —— 有 NRST 就用,没有也不报错
#   cortex_m reset_config sysresetreq —— reset 走 SWD 的 SYSRESETREQ,不依赖 NRST
#   examine-end 事件里已让 DBGMCU 冻结 IWDG/WWDG
#     (本工程开了看门狗,没有这条的话一停断点就会被狗复位)

# ------------------------------- SWD 速度 -----------------------------------
# 注意:必须写在 source target 之后 —— stm32f4x.cfg 内部会把速度设回 2000。
# 连不上或报 "Error: JTAG scan chain interrogation failed" 就降到 1000 甚至 500。
adapter speed 4000

# ------------------------------- 启动服务 -----------------------------------
# 起 GDB server(3333)、telnet(4444)、tcl(6666)。这里不 halt,
# 是不想让调试器一启动就停住 CPU —— 由 GDB 决定何时 reset/停住。
init
